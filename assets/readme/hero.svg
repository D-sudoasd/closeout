<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">closeout — ship work, leave a clean desk</title>
  <desc id="desc">Agent skill for git closeout: status, verify, commit, push, PR, merge gate, and squash-aware prune with an evidence report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1C2430" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#243041" stroke-width="1"/>

  <!-- left title -->
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="118" height="28" rx="8" fill="#1A2330" stroke="#2C3A4F"/>
    <text x="14" y="19" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AGENT SKILL</text>

    <text x="0" y="88" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="64" font-weight="700">closeout</text>
    <text x="0" y="132" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">Ship the work. Leave a clean desk.</text>
    <text x="0" y="170" fill="#8B93A7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">status → verify → commit → push → PR → merge → prune</text>

    <g transform="translate(0 214)">
      <rect x="0" y="0" width="92" height="34" rx="10" fill="#123528" stroke="#2F8F62"/>
      <text x="16" y="22" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">v2.0.0</text>
      <rect x="104" y="0" width="132" height="34" rx="10" fill="#1A2330" stroke="#2C3A4F"/>
      <text x="118" y="22" fill="#C8D0DC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">squash-aware</text>
      <rect x="248" y="0" width="148" height="34" rx="10" fill="#1A2330" stroke="#2C3A4F"/>
      <text x="262" y="22" fill="#C8D0DC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">evidence report</text>
    </g>
  </g>

  <!-- right proof: terminal evidence card -->
  <g transform="translate(640 42)">
    <rect x="0" y="0" width="500" height="276" rx="18" fill="#0E141C" stroke="#2C3A4F"/>
    <circle cx="28" cy="26" r="6" fill="#FF5F57"/>
    <circle cx="50" cy="26" r="6" fill="#FEBC2E"/>
    <circle cx="72" cy="26" r="6" fill="#28C840"/>
    <text x="100" y="31" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">closeout report</text>
    <line x1="0" y1="48" x2="500" y2="48" stroke="#243041"/>

    <text x="24" y="82" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">branch</text>
    <text x="150" y="82" fill="#F4F1EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">feat/demo @ a1b2c3d</text>

    <text x="24" y="112" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">verify</text>
    <text x="150" y="112" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">git diff --check  exit 0</text>

    <text x="24" y="142" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">push</text>
    <text x="150" y="142" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">local == origin SHA</text>

    <text x="24" y="172" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">PR</text>
    <text x="150" y="172" fill="#F4F1EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">#42 headOid matched</text>

    <text x="24" y="202" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">prune</text>
    <text x="150" y="202" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">SAFE squash · tip match</text>

    <rect x="24" y="226" width="452" height="34" rx="10" fill="#123528" stroke="#2F8F62"/>
    <text x="40" y="248" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">clean desk: YES  ·  rechecked</text>
  </g>
</svg>
