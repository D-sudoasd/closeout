<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Before unguarded agent push vs after closeout</title>
  <desc id="desc">Left: blind add, red verify still pushed, squash branches left behind. Right: intentional stage, exit codes, evidence report, clean desk.</desc>
  <rect width="1200" height="380" rx="28" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#243041"/>

  <text x="48" y="48" fill="#8B93A7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">BEFORE / AFTER</text>
  <text x="48" y="82" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="700">Same “收工”, different outcomes</text>

  <!-- BEFORE card -->
  <g transform="translate(48 112)">
    <rect width="520" height="220" rx="18" fill="#1A1214" stroke="#5A3038"/>
    <text x="24" y="40" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">UNGUARDED AGENT</text>
    <text x="24" y="78" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">git add -A &amp;&amp; push</text>
    <text x="24" y="114" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· secrets / raw data may ride along</text>
    <text x="24" y="144" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· verify red still ships</text>
    <text x="24" y="174" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· squash branches “not merged”</text>
    <text x="24" y="204" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">clean desk: unknown</text>
  </g>

  <!-- AFTER card -->
  <g transform="translate(632 112)">
    <rect width="520" height="220" rx="18" fill="#101A16" stroke="#2F8F62"/>
    <text x="24" y="40" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">CLOSEOUT</text>
    <text x="24" y="78" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">plan → verify → ship → recheck</text>
    <text x="24" y="114" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· intentional stage; skip junk paths</text>
    <text x="24" y="144" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· fail stops push unless re-authorized</text>
    <text x="24" y="174" fill="#C8D0DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">· PR headOid == tip → SAFE prune</text>
    <text x="24" y="204" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">clean desk: YES · with evidence</text>
  </g>
</svg>
